<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Juveria Khatoon is a Full Stack .NET Developer building resilient systems and thoughtful interfaces with Angular, .NET, and Azure." />
    <meta name="theme-color" content="#1b2927" />
    <title>Juveria Khatoon 🌻</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <label for="netlify-bot-field">Bot field</label>
      <input id="netlify-bot-field" name="bot-field" />
      <label for="netlify-name">Name</label>
      <input id="netlify-name" name="name" />
      <label for="netlify-email">Email</label>
      <input id="netlify-email" name="email" />
      <label for="netlify-topic">Topic</label>
      <select id="netlify-topic" name="topic"><option value=""></option></select>
      <label for="netlify-message">Message</label>
      <textarea id="netlify-message" name="message"></textarea>
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
