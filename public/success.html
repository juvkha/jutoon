<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message sent · Juveria Khatoon</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');
      :root{--ink:#1b2927;--muted:#65706b;--paper:#f4f0e8;--cream:#fbf8f1;--forest:#24403b;--coral:#e56d4b;--sans:'DM Sans',sans-serif;--serif:'Playfair Display',serif;--mono:'DM Mono',monospace}
      *{box-sizing:border-box}
      body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--paper);color:var(--ink);font-family:var(--sans)}
      main{max-width:480px;padding:56px 44px;background:var(--cream);box-shadow:6px 6px 0 var(--coral)}
      p.eyebrow{margin:0 0 18px;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
      h1{margin:0 0 18px;font:500 clamp(32px,5vw,44px)/1.1 var(--serif);letter-spacing:-1px}
      p{margin:0 0 32px;color:var(--muted);line-height:1.6}
      a{display:inline-flex;gap:10px;align-items:center;padding:14px 22px;background:var(--forest);color:var(--cream);text-decoration:none;font-size:13px;font-weight:700}
      a:hover{background:var(--ink)}
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Message sent</p>
      <h1>Thanks for reaching out.</h1>
      <p>Your message has been sent successfully. I’ll get back to you soon.</p>
      <a href="/">Return to the portfolio ↗</a>
    </main>
  </body>
</html>
